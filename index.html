<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ABC Castle Builder</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell">
      <section class="play-screen" id="playScreen" aria-label="Tr&#242; ch&#417;i ABC Castle Builder">
        <div class="sky-items" aria-hidden="true">
          <span class="cloud cloud-one"></span>
          <span class="cloud cloud-two"></span>
          <span class="balloon balloon-one"></span>
          <span class="balloon balloon-two"></span>
          <span class="star star-one">&#9733;</span>
          <span class="star star-two">&#9733;</span>
        </div>

        <div class="top-bar">
          <button class="small-button" id="replayTopButton" type="button" aria-label="Ch&#417;i l&#7841;i">&#8635;</button>
          <div class="level-title">
            <span id="categoryLabel">B&#224;i h&#7885;c</span>
            <strong id="nextLabel">Gh&#233;p ch&#7919;</strong>
          </div>
          <button class="small-button" id="soundButton" type="button" aria-label="B&#7853;t &#226;m thanh">&#9834;</button>
        </div>

        <!-- <div class="progress-wrap" aria-label="Ti&#7871;n &#273;&#7897; x&#226;y l&#226;u &#273;&#224;i">
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span id="progressText">0%</span>
        </div> -->

        <div class="lesson-card" aria-live="polite">
          <div class="lesson-emoji" id="lessonEmoji" aria-hidden="true">&#127775;</div>
          <div>
            <p class="eyebrow" id="lessonType">B&#224;i h&#7885;c ng&#7851;u nhi&#234;n</p>
            <h1 id="lessonPrompt">H&#227;y gh&#233;p t&#234;n &#273;&#250;ng nh&#233;!</h1>
            <p class="subtitle" id="lessonHint">K&#233;o ho&#7863;c ch&#7841;m c&#225;c kh&#7889;i ch&#7919; &#273;&#7875; x&#226;y l&#226;u &#273;&#224;i.</p>
          </div>
        </div>

        <div class="stage">
          <div class="decor decor-cloud"></div>
          <div class="decor decor-stars">&#9733; &#10022; &#9733;</div>
          <div class="fireworks" id="fireworks" aria-hidden="true"></div>
          <!-- <div class="prompt-card" aria-live="polite">
            <span class="prompt-kicker">G&#7907;i &#253;</span>
            <p id="promptText">T&#236;m ch&#7919; &#273;&#7847;u ti&#234;n</p>
          </div> -->

          <div class="castle-zone">
            <!-- <div class="castle-roof">
              <span></span>
              <span></span>
              <span></span>
            </div> -->
            <div class="slot-grid word-grid" id="slotGrid" aria-label="C&#225;c &#244; gh&#233;p t&#7915;"></div>
            <!-- <div class="castle-gate"></div> -->
          </div>
        </div>

        <div class="tray-wrap">
          <div class="tray-label">Ch&#7885;n ch&#7919; c&#225;i &#273;&#7875; gh&#233;p t&#7915; ti&#7871;ng Anh</div>
          <div class="block-tray" id="blockTray" aria-label="C&#225;c kh&#7889;i ch&#7919; c&#243; th&#7875; ch&#7885;n"></div>
        </div>

        <div class="celebration is-hidden" id="celebration" role="dialog" aria-modal="true" aria-labelledby="celebrationTitle">
          <div class="celebration-panel">
            <div class="reward-row" aria-hidden="true">
              <span>&#9733;</span><span>&#9670;</span><span>&#10047;</span><span>&#9733;</span><span>&#9670;</span>
            </div>
            <h2 id="celebrationTitle">Gi&#7887;i qu&#225;!</h2>
            <div class="reward-animation" id="rewardAnimation" data-scene="magic" aria-hidden="true">
              <span class="reward-glow"></span>
              <span class="bird-scene">
                <span class="bird-cloud c1"></span>
                <span class="bird-cloud c2"></span>
                <span class="bird-trail t1"></span>
                <span class="bird-trail t2"></span>
                <span class="flying-bird">
                  <span class="bird-wing left"></span>
                  <span class="bird-wing right"></span>
                  <span class="bird-body"></span>
                  <span class="bird-eye"></span>
                  <span class="bird-beak"></span>
                </span>
              </span>
              <span class="meaning-scene">
                <span class="scene-sun"></span>
                <span class="scene-wave"></span>
                <span class="scene-ground"></span>
                <span class="scene-pop p1"></span>
                <span class="scene-pop p2"></span>
                <span class="scene-pop p3"></span>
                <span class="scene-item" id="sceneItem">&#11088;</span>
              </span>
              <span class="reward-castle">
                <span class="reward-tower left"></span>
                <span class="reward-tower right"></span>
                <span class="reward-wall"></span>
                <span class="reward-flag"></span>
              </span>
              <span class="reward-spark s1">&#9733;</span>
              <span class="reward-spark s2">&#10022;</span>
              <span class="reward-spark s3">&#9670;</span>
              <span class="reward-spark s4">&#10047;</span>
              <span class="reward-spark s5">&#9733;</span>
            </div>
            <strong class="celebration-word" id="celebrationWord">ABC</strong>
            <span class="celebration-translation" id="celebrationTranslation">English</span>
            <!-- <p id="celebrationText">B&#233; &#273;&#227; gh&#233;p &#273;&#250;ng t&#7915; r&#7891;i.</p> -->
            <div class="action-row">
              <button class="primary-button listen" id="listenButton" type="button">Nghe l&#7841;i</button>
              <!-- <button class="primary-button" id="replayButton" type="button">Ch&#417;i l&#7841;i</button> -->
              <button class="primary-button next" id="nextButton" type="button">B&#224;i m&#7899;i</button>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
